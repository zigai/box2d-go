name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.arch }}${{ matrix.goamd64 && format(' {0}', matrix.goamd64) || '' }}, ${{ matrix.precision }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      GOAMD64: ${{ matrix.goamd64 || 'v1' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest, precision: float, tags: "" }
          - { arch: amd64, runner: ubuntu-latest, precision: double, tags: box2d_double }
          - { arch: amd64, goamd64: v3, runner: ubuntu-latest, precision: float, tags: "" }
          - {
              arch: amd64,
              goamd64: v3,
              runner: ubuntu-latest,
              precision: double,
              tags: box2d_double,
            }
          - { arch: arm64, runner: ubuntu-24.04-arm, precision: float, tags: "" }
          - { arch: arm64, runner: ubuntu-24.04-arm, precision: double, tags: box2d_double }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Check architecture
        run: test "$(go env GOARCH)" = "${{ matrix.arch }}"
      - name: go vet
        run: go vet -tags "${{ matrix.tags }}" ./...
      - name: go test
        run: go test -timeout 60m -tags "${{ matrix.tags }}" ./...
      - name: go test -race
        run: go test -race -timeout 90m -tags "${{ matrix.tags }}" ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: internal/lint/go.sum
      - uses: extractions/setup-just@v4
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true
      - name: Install C and shell linters
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev
          pipx install clang-format==23.1.3
          pipx install clang-tidy==23.1.4
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
      - name: Read upstream pin
        id: upstream
        run: echo "sha=$(grep -Eo '^[0-9a-f]{40}' UPSTREAM)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: erincatto/box2d
          ref: ${{ steps.upstream.outputs.sha }}
          path: oracle/.upstream/box2d
          persist-credentials: false
      - run: just lint
