name: oracle

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    name: fixtures are fresh
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install cmake and gcc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake gcc

      - name: Rebuild fixtures
        run: ./oracle/build.sh

      - name: Fixtures match the commit
        run: |
          git add --intent-to-add testdata/oracle
          git diff --exit-code testdata/oracle
