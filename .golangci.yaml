version: "2"

run:
  timeout: 3m

formatters:
  enable:
    - goimports
    - gofumpt
    - golines
  settings:
    gofumpt:
      extra:
        balance-calls: true
    golines:
      max-len: 100
    goimports:
      local-prefixes:
        - github.com/zigai/box2d-go

linters:
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct_v5
    - exptostd
    - fatcontext
    - forcetypeassert
    - funcorder
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - godoclint
    - godot
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - thelper
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint

  settings:
    thelper:
      benchmark:
        begin: false
    mnd:
      ignored-numbers:
        - "0o600"
        - "0o644"
        - "0o700"
        - "0o750"
        - "0600"
        - "0644"
        - "0700"
        - "0750"
    embeddedstructfieldcheck:
      forbid-mutex: true
    errcheck:
      check-type-assertions: true
    exhaustive:
      check:
        - switch
    gochecksumtype:
      default-signifies-exhaustive: false
    cyclop:
      max-complexity: 12
    decorder:
      disable-dec-order-check: false
      dec-order:
        - const
        - var
        - type
        - func
    funcorder:
      function: true
    gocognit:
      min-complexity: 20
    goconst:
      min-occurrences: 16
    lll:
      line-length: 120
      tab-width: 4
    gocritic:
      enabled-tags: [diagnostic]
      settings:
        captLocal:
          paramsOnly: false
        underef:
          skipRecvDeref: false
    godoclint:
      disable:
        - start-with-name
      enable:
        - no-unused-link
        - require-stdlib-doclink
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    misspell:
      locale: US
    nakedret:
      max-func-lines: 5
    revive:
      rules:
        - name: error-naming
        - name: if-return
        - name: var-naming
          arguments: [[], ["GRPC", "IOS"]]
        - name: context-as-argument
          arguments:
            - allow-types-before: "*testing.T,testing.TB,*testing.B,*testing.F"
        - name: import-shadowing
        - name: package-naming
          arguments:
            - check-extra-bad-name: true
              user-defined-bad-names: [handlers]
        - name: package-directory-mismatch
        - name: filename-format
          arguments: ["^[a-z0-9][a-z0-9_]*\\.go$"]
        - name: exported
          arguments:
            - disable-checks-on-constants
            - disable-checks-on-functions
            - disable-checks-on-methods
            - disable-checks-on-types
            - disable-checks-on-variables
        - name: redundant-import-alias
        - name: import-alias-naming
        - name: dot-imports
        - name: blank-imports
        - name: error-strings
        - name: receiver-naming
        - name: indent-error-flow
        - name: superfluous-else
        - name: modifies-parameter
        - name: enforce-repeated-arg-type-style
          arguments: ["full"]
        - name: unreachable-code
          disabled: true
        - name: redefines-builtin-id
          disabled: true
    rowserrcheck:
      packages:
        - github.com/jmoiron/sqlx
    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
          toml: snake
    exhaustruct_v5:
      allow-empty-returns: true
      # Types whose zero fields mean "use the default". Mark such types in
      # this module with //exhaustruct:optional instead of listing them here.
      ignore-patterns:
        - "^github\\.com/spf13/cobra\\..+$"
        - "^github\\.com/spf13/pflag\\..+$"
        - "^github\\.com/urfave/cli(/v[0-9]+)?\\..+$"
        - "^net/http\\.(Client|Server|Transport)$"
        - "^net\\.(Dialer|ListenConfig)$"
        - "^net/url\\.URL$"
        - "^crypto/tls\\.Config$"
        - "^log/slog\\.HandlerOptions$"
        - "^os/exec\\.Cmd$"
        - "^syscall\\.SysProcAttr$"
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1016
        - -QF1008
        - -QF1011
        - -ST1020
        - -ST1021
        - -ST1022
    nolintlint:
      allow-no-explanation: [gocognit, golines]
      require-explanation: true
      require-specific: true
    gosec:
      excludes:
        - G204 # subprocess launched with variable
        - G301 # directory perms
        - G302 # file perms
        - G304 # file path from variable
        - G115 # integer conversions; ids and counts are fixed-width like upstream
        - G602 # slice index; bounds are checked at runtime

  exclusions:
    warn-unused: false
    presets: []
    rules:
      - path: ".*_test\\.go"
        linters: [decorder, funcorder, cyclop, gocognit, dupl, maintidx, exhaustruct_v5, goconst]

      # A test writes its own output to paths the developer running it chooses.
      - path: ".*_test\\.go"
        linters: [gosec]
        text: "G703:"

      # Test-helper packages (named like httptest) only build fixtures.
      - path: "(^|/)[a-z0-9]+test/"
        linters: [exhaustruct_v5]

      # Ported C and the harness that mirrors the C reference programs keep
      # upstream's numeric literals and zero-initialized struct fields.
      - path: "^(box2d|internal)/"
        linters: [mnd, exhaustruct_v5]
      - path: "^box2d/body\\.go$"
        linters: [gocritic]
        source: "^[\\t ]*if bodyA\\.bodyType != DynamicBody && bodyB\\.bodyType != DynamicBody \\{$"
        text: "^(?:ifElseChain: rewrite if-else to switch statement)$"
      - path: "^box2d/constraint_graph\\.go$"
        linters: [dupl]
        source: "^func remove(Contact|Joint)FromGraph\\("
        text: "^(?:143-179 lines are duplicate of `box2d/constraint_graph\\.go:256-284`|256-284 lines are duplicate of `box2d/constraint_graph\\.go:143-179`)$"
      - path: "^box2d/contact_solver\\.go$"
        linters: [dupl]
        source: "^[\\t ]*\\{$"
        text: "^(?:1673-1713 lines are duplicate of `box2d/contact_solver\\.go:1715-1755`|1715-1755 lines are duplicate of `box2d/contact_solver\\.go:1673-1713`)$"
      - path: "^box2d/distance_joint\\.go$"
        linters: [nestif]
        source: "^[\\t ]*if jnt\\.enableSpring && \\(jnt\\.minLength < jnt\\.maxLength \\|\\| !jnt\\.enableLimit\\) \\{$"
        text: "^(?:`if jnt\\.enableSpring && \\(jnt\\.minLength < jnt\\.maxLength \\|\\| !jnt\\.enableLimit\\)` has complex nested blocks \\(complexity: 5\\))$"
      - path: "^box2d/dynamic_tree\\.go$"
        linters: [cyclop, gocognit]
        source: "^[\\t ]*func \\(tree \\*DynamicTree\\) CastBox\\("
        text: "^(?:calculated cyclomatic complexity for function CastBox is 13, max is 12|cognitive complexity 30 of func `\\(\\*DynamicTree\\)\\.CastBox` is high \\(> 20\\))$"
      - path: "^box2d/dynamic_tree\\.go$"
        linters: [cyclop, gocognit]
        source: "^[\\t ]*func \\(tree \\*DynamicTree\\) CastRay\\("
        text: "^(?:calculated cyclomatic complexity for function CastRay is 13, max is 12|cognitive complexity 30 of func `\\(\\*DynamicTree\\)\\.CastRay` is high \\(> 20\\))$"
      - path: "^box2d/dynamic_tree\\.go$"
        linters: [gocognit]
        source: "^[\\t ]*func \\(tree \\*DynamicTree\\) Query\\("
        text: "^(?:cognitive complexity 21 of func `\\(\\*DynamicTree\\)\\.Query` is high \\(> 20\\))$"
      - path: "^box2d/dynamic_tree\\.go$"
        linters: [cyclop, gocognit]
        source: "^[\\t ]*func findBestSibling\\(tree \\*DynamicTree, boxD AABB\\) int \\{$"
        text: "^(?:calculated cyclomatic complexity for function findBestSibling is 16, max is 12|cognitive complexity 29 of func `findBestSibling` is high \\(> 20\\))$"
      - path: "^box2d/dynamic_tree_test\\.go$"
        linters: [cyclop, gocognit, maintidx]
        source: "^[\\t ]*func runDynamicTreeTreeDfsOrderTest\\(t \\*testing\\.T\\) \\{$"
        text: "^(?:calculated cyclomatic complexity for function runDynamicTreeTreeDfsOrderTest is 31, max is 12|cognitive complexity 32 of func `runDynamicTreeTreeDfsOrderTest` is high \\(> 20\\)|Function name: runDynamicTreeTreeDfsOrderTest, Cyclomatic Complexity: 31, Halstead Volume: 9687\\.82, Maintainability Index: 13)$"
      - path: "^box2d/dynamic_tree_test\\.go$"
        linters: [cyclop, gocognit, maintidx]
        source: "^[\\t ]*func runDynamicTreeTreeLeafRootTest\\(t \\*testing\\.T\\) \\{$"
        text: "^(?:calculated cyclomatic complexity for function runDynamicTreeTreeLeafRootTest is 31, max is 12|cognitive complexity 30 of func `runDynamicTreeTreeLeafRootTest` is high \\(> 20\\)|Function name: runDynamicTreeTreeLeafRootTest, Cyclomatic Complexity: 31, Halstead Volume: 10368\\.64, Maintainability Index: 13)$"
      - path: "^box2d/dynamic_tree_test\\.go$"
        linters: [cyclop, gocognit, maintidx]
        source: "^[\\t ]*func runDynamicTreeTreeMarkAndRefitTest\\(t \\*testing\\.T\\) \\{$"
        text: "^(?:calculated cyclomatic complexity for function runDynamicTreeTreeMarkAndRefitTest is 31, max is 12|cognitive complexity 35 of func `runDynamicTreeTreeMarkAndRefitTest` is high \\(> 20\\)|Function name: runDynamicTreeTreeMarkAndRefitTest, Cyclomatic Complexity: 31, Halstead Volume: 8112\\.54, Maintainability Index: 15)$"
      - path: "^box2d/dynamic_tree_test\\.go$"
        linters: [cyclop, gocognit, maintidx]
        source: "^[\\t ]*func runDynamicTreeTreeOneProxyTest\\(t \\*testing\\.T\\) \\{$"
        text: "^(?:calculated cyclomatic complexity for function runDynamicTreeTreeOneProxyTest is 29, max is 12|cognitive complexity 28 of func `runDynamicTreeTreeOneProxyTest` is high \\(> 20\\)|Function name: runDynamicTreeTreeOneProxyTest, Cyclomatic Complexity: 29, Halstead Volume: 9756\\.23, Maintainability Index: 14)$"
      - path: "^box2d/dynamic_tree_test\\.go$"
        linters: [cyclop, maintidx]
        source: "^[\\t ]*func runDynamicTreeTreeRayCastTest\\(t \\*testing\\.T\\) \\{$"
        text: "^(?:calculated cyclomatic complexity for function runDynamicTreeTreeRayCastTest is 18, max is 12|Function name: runDynamicTreeTreeRayCastTest, Cyclomatic Complexity: 18, Halstead Volume: 11476\\.28, Maintainability Index: 13)$"
      - path: "^internal/oracle/oracle\\.go$"
        linters: [unparam]
        source: "^[\\t ]*func \\(r \\*Reader\\) checkFloat\\("
        text: "^(?:\\(\\*Reader\\)\\.checkFloat - width always receives 32)$"
      - path: "^box2d/joint\\.go$"
        linters: [cyclop]
        source: "^[\\t ]*func drawJointGeometry\\("
        text: "^(?:calculated cyclomatic complexity for function drawJointGeometry is 13, max is 12)$"
      - path: "^box2d/joint\\.go$"
        linters: [cyclop]
        source: "^[\\t ]*func placeJointInSolverSet\\("
        text: "^(?:calculated cyclomatic complexity for function placeJointInSolverSet is 13, max is 12)$"
      - path: "^box2d/joint\\.go$"
        linters: [gocritic, nestif]
        source: "^[\\t ]*if bodyA\\.setIndex == disabledSet \\|\\| bodyB\\.setIndex == disabledSet \\{$"
        text: "^(?:ifElseChain: rewrite if-else to switch statement|`if bodyA\\.setIndex == disabledSet \\|\\| bodyB\\.setIndex == disabledSet` has complex nested blocks \\(complexity: 5\\))$"
      - path: "^box2d/joint\\.go$"
        linters: [gocritic]
        source: "^[\\t ]*if typeA == DynamicBody && typeB == DynamicBody \\{$"
        text: "^(?:ifElseChain: rewrite if-else to switch statement)$"
      - path: "^box2d/manifold\\.go$"
        linters: [cyclop, gocognit, maintidx]
        source: "^[\\t ]*func CollideCapsules\\("
        text: "^(?:calculated cyclomatic complexity for function CollideCapsules is 40, max is 12|cognitive complexity 56 of func `CollideCapsules` is high \\(> 20\\)|Function name: CollideCapsules, Cyclomatic Complexity: 40, Halstead Volume: 7248\\.68, Maintainability Index: 15)$"
      - path: "^box2d/manifold\\.go$"
        linters: [cyclop, gocognit, maintidx]
        source: "^[\\t ]*func CollideChainSegmentAndPolygon\\("
        text: "^(?:calculated cyclomatic complexity for function CollideChainSegmentAndPolygon is 48, max is 12|cognitive complexity 102 of func `CollideChainSegmentAndPolygon` is high \\(> 20\\)|Function name: CollideChainSegmentAndPolygon, Cyclomatic Complexity: 48, Halstead Volume: 8965\\.45, Maintainability Index: 8)$"
      - path: "^box2d/manifold\\.go$"
        linters: [cyclop, gocognit]
        source: "^[\\t ]*func CollidePolygons\\("
        text: "^(?:calculated cyclomatic complexity for function CollidePolygons is 22, max is 12|cognitive complexity 32 of func `CollidePolygons` is high \\(> 20\\))$"
      - path: "^box2d/manifold\\.go$"
        linters: [nestif]
        source: "^[\\t ]*if !behind1 && output\\.Distance > float32\\(0\\.1\\*LinearSlop\\(\\)\\) \\{$"
        text: "^(?:`if !behind1 && output\\.Distance > float32\\(0\\.1\\*LinearSlop\\(\\)\\)` has complex nested blocks \\(complexity: 72\\))$"
      - path: "^box2d/manifold\\.go$"
        linters: [nestif]
        source: "^[\\t ]*if !outsideA && !outsideB \\{$"
        text: "^(?:`if !outsideA && !outsideB` has complex nested blocks \\(complexity: 18\\))$"
      - path: "^box2d/manifold\\.go$"
        linters: [nestif]
        source: "^[\\t ]*if incidentNormal != -1 \\{$"
        text: "^(?:`if incidentNormal != -1` has complex nested blocks \\(complexity: 10\\))$"
      - path: "^box2d/manifold\\.go$"
        linters: [nestif]
        source: "^[\\t ]*if manifold\\.PointCount == 0 \\{$"
        text: "^(?:`if manifold\\.PointCount == 0` has complex nested blocks \\(complexity: 6\\))$"
      - path: "^box2d/manifold\\.go$"
        linters: [gocritic]
        source: "^[\\t ]*if result\\.Fraction1 == 0\\.0 && result\\.Fraction2 == 0\\.0 \\{$"
        text: "^(?:ifElseChain: rewrite if-else to switch statement)$"
      - path: "^box2d/manifold\\.go$"
        linters: [gocritic]
        source: "^[\\t ]*if s1 < 0\\.0 \\{$"
        text: "^(?:ifElseChain: rewrite if-else to switch statement)$"
      - path: "^box2d/manifold\\.go$"
        linters: [nestif]
        source: "^[\\t ]*if separationA > float32\\(0\\.1\\*linearSlop\\) \\|\\| separationB > float32\\(0\\.1\\*linearSlop\\) \\{$"
        text: "^(?:`if separationA > float32\\(0\\.1\\*linearSlop\\) \\|\\| separationB > float32\\(0\\.1\\*linearSlop\\)` has complex nested blocks \\(complexity: 12\\))$"
      - path: "^box2d/manifold\\.go$"
        linters: [gocritic]
        source: "^[\\t ]*if u1 < 0\\.0 && separation > float32\\(0x1p-23\\) \\{$"
        text: "^(?:ifElseChain: rewrite if-else to switch statement)$"
      - path: "^box2d/physics_world_query\\.go$"
        linters: [gocritic]
        source: "^[\\t ]*if bodySetIndex == disabledSet \\|\\| otherBody\\.setIndex == disabledSet \\{$"
        text: "^(?:ifElseChain: rewrite if-else to switch statement)$"
      - path: "^box2d/physics_world_query\\.go$"
        linters: [gocritic]
        source: "^[\\t ]*if draw\\.DrawGraphColors && contact\\.colorIndex != nullIndex \\{$"
        text: "^(?:ifElseChain: rewrite if-else to switch statement)$"
      - path: "^box2d/physics_world_query\\.go$"
        linters: [gocritic]
        source: "^[\\t ]*if setIndex == disabledSet \\|\\| otherBody\\.setIndex == disabledSet \\{$"
        text: "^(?:ifElseChain: rewrite if-else to switch statement)$"
      - path: "^box2d/prismatic_joint\\.go$"
        linters: [maintidx]
        source: "^[\\t ]*func solvePrismaticJoint\\(base \\*jointSim, context \\*stepContext, useBias bool\\) \\{$"
        text: "^(?:Function name: solvePrismaticJoint, Cyclomatic Complexity: 11, Halstead Volume: 8901\\.23, Maintainability Index: 17)$"
      - path: "^box2d/prismatic_joint\\.go$"
        linters: [dupl]
        source: "^[\\t ]*if separation < speculativeDistance \\{$"
        text: "^(?:648-679 lines are duplicate of `box2d/prismatic_joint\\.go:689-723`|689-723 lines are duplicate of `box2d/prismatic_joint\\.go:648-679`)$"
      - path: "^box2d/recording_mutations_test\\.go$"
        linters: [cyclop, maintidx]
        source: "^[\\t ]*func TestRecordingMutationParity\\(t \\*testing\\.T\\) \\{$"
        text: "^(?:calculated cyclomatic complexity for function TestRecordingMutationParity is 23, max is 12|Function name: TestRecordingMutationParity, Cyclomatic Complexity: 23, Halstead Volume: 10557\\.47, Maintainability Index: 17)$"
      - path: "^box2d/recording_test\\.go$"
        linters: [cyclop, maintidx]
        source: "^[\\t ]*func TestRecording\\(t \\*testing\\.T\\) \\{$"
        text: "^(?:calculated cyclomatic complexity for function TestRecording is 16, max is 12|Function name: TestRecording, Cyclomatic Complexity: 16, Halstead Volume: 12550\\.92, Maintainability Index: 15)$"
      - path: "^box2d/simd_accel_amd64\\.go$"
        linters: [gosec]
        source: "unsafe\\.Pointer\\("
        text: "^G103: Use of unsafe calls should be audited$"
      - path: "^box2d/snapshot\\.go$"
        linters: [cyclop]
        source: "^[\\t ]*func snapMinSize\\[T any\\]\\(\\) int \\{$"
        text: "^(?:calculated cyclomatic complexity for function snapMinSize is 22, max is 12)$"
      - path: "^box2d/snapshot\\.go$"
        linters: [cyclop]
        source: "^[\\t ]*func snapReadValue\\[T any\\]\\(r \\*snapReader, value \\*T\\) \\{$"
        text: "^(?:calculated cyclomatic complexity for function snapReadValue is 22, max is 12)$"
      - path: "^box2d/snapshot\\.go$"
        linters: [cyclop]
        source: "^[\\t ]*func snapWriteValue\\[T any\\]\\(buf \\*recBuffer, value T\\) \\{$"
