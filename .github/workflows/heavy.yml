name: heavy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stress:
    name: stress (${{ matrix.arch }}${{ matrix.goamd64 && format(' {0}', matrix.goamd64) || '' }}, ${{ matrix.precision }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      GOAMD64: ${{ matrix.goamd64 || 'v1' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest, precision: float, tags: "" }
          - { arch: amd64, runner: ubuntu-latest, precision: double, tags: box2d_double }
          - { arch: amd64, goamd64: v3, runner: ubuntu-latest, precision: float, tags: "" }
          - {
              arch: amd64,
              goamd64: v3,
              runner: ubuntu-latest,
              precision: double,
              tags: box2d_double,
            }
          - { arch: arm64, runner: ubuntu-24.04-arm, precision: float, tags: "" }
          - { arch: arm64, runner: ubuntu-24.04-arm, precision: double, tags: box2d_double }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Check architecture
        run: test "$(go env GOARCH)" = "${{ matrix.arch }}"
      - name: go vet stress
        run: go vet -tags "box2d_stress ${{ matrix.tags }}" ./...
      - name: go test stress
        run: ./test/run.sh stress -timeout 60m -tags "box2d_stress ${{ matrix.tags }}"
      - name: go test stress -race
        run: ./test/run.sh stress -race -timeout 90m -tags "box2d_stress ${{ matrix.tags }}"

  test-wasm:
    name: test (wasm, ${{ matrix.precision }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GOOS: js
      GOARCH: wasm
    strategy:
      fail-fast: false
      matrix:
        include:
          - { precision: float, tags: "" }
          - { precision: double, tags: box2d_double }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: go vet
        run: go vet -tags "${{ matrix.tags }}" ./...
      - name: go test
        run: ./test/run.sh all -timeout 60m -exec "$(go env GOROOT)/lib/wasm/go_js_wasm_exec" -tags "box2d_stress ${{ matrix.tags }}"

  skips:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: extractions/setup-just@v4
      - name: Count unported skips
        run: just skips | tee -a "$GITHUB_STEP_SUMMARY"
