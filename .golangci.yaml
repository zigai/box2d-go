      - path: "^box2d/solver\\.go$"
        linters: [cyclop, gocognit, maintidx]
        source: "^[\\t ]*func solverTask\\(taskContext \\*workerContext\\) \\{$"
        text: "^(?:calculated cyclomatic complexity for function solverTask is 18, max is 12|cognitive complexity 44 of func `solverTask` is high \\(> 20\\)|Function name: solverTask, Cyclomatic Complexity: 18, Halstead Volume: 4727\\.85, Maintainability Index: 18)$"
      - path: "^box2d/solver_test\\.go$"
        linters: [thelper]
        source: "^[\\t ]*func testSolverArenaGrowthShrink\\(t \\*testing\\.T, workers int\\) \\{$"
