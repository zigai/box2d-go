        text: "^(?:test helper function should start from t\\.Helper\\(\\))$"
      - path: "^box2d/solver_test\\.go$"
        linters: [thelper]
        source: "^[\\t ]*func testSolverArenaZero\\(t \\*testing\\.T, workers int\\) \\{$"
        text: "^(?:test helper function should start from t\\.Helper\\(\\))$"
      - path: "^box2d/solver_test\\.go$"
        linters: [thelper]
        source: "^[\\t ]*func testSolverScratchInactiveContacts\\(t \\*testing\\.T, workers int\\) \\{$"
        text: "^(?:test helper function should start from t\\.Helper\\(\\))$"
      - path: "^box2d/solver_test\\.go$"
        linters: [thelper]
        source: "^[\\t ]*func testSolverScratchRepeatedContacts\\(t \\*testing\\.T, workers int\\) \\{$"
        text: "^(?:test helper function should start from t\\.Helper\\(\\))$"
      - path: "^box2d/solver_test\\.go$"
        linters: [thelper]
        source: "^[\\t ]*func testSolverScratchSleepingContacts\\(t \\*testing\\.T, workers int\\) \\{$"
        text: "^(?:test helper function should start from t\\.Helper\\(\\))$"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
