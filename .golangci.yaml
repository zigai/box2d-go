      - path: "^box2d/solver_test\\.go$"
        linters: [cyclop, thelper]
        source: "^[\\t ]*func testSolverArenaRestoreDestroy\\(t \\*testing\\.T, workers int\\) \\{$"
        text: "^(?:calculated cyclomatic complexity for function testSolverArenaRestoreDestroy is 13, max is 12|test helper function should start from t\\.Helper\\(\\))$"
      - path: "^box2d/solver_test\\.go$"
        linters: [thelper]
        source: "^[\\t ]*func testSolverArenaReuse\\(t \\*testing\\.T, workers int\\) \\{$"
        text: "^(?:test helper function should start from t\\.Helper\\(\\))$"
